name: Build Android APK (Debug)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Debug) - Capacitor, Gradle & Java 17
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'

    steps:
      # Tahap 1: Checkout Repository menggunakan actions/checkout@v4
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # Pengecekan file .env (Copy dari .env.example jika belum tersedia)
      - name: Pengecekan File .env
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              echo "[INFO] File .env tidak ditemukan. Menyalin dari .env.example..."
              cp .env.example .env
              echo "[SUCCESS] File .env berhasil dibuat dari .env.example."
            else
              echo "[WARN] File .env.example tidak ditemukan. Membuat file .env kosong..."
              touch .env
            fi
          else
            echo "[INFO] File .env sudah ada."
          fi

      # Tahap 2: Setup Node.js versi 22 (actions/setup-node@v4)
      - name: 2. Setup Node.js Versi 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Verifikasi Versi Node.js & npm
        run: |
          echo "[INFO] Versi Node.js aktif: $(node -v)"
          echo "[INFO] Versi npm aktif: $(npm -v)"

      # Tahap 3: Install Dependencies Web & Build (Vite/TypeScript)
      - name: 3. Install Dependencies Web & Build (Vite)
        run: |
          echo "[INFO] Menginstal dependensi npm..."
          npm install --legacy-peer-deps
          echo "[INFO] Menjalankan build Vite ke folder dist..."
          npm run build
          if [ -d "dist" ]; then
            echo "[SUCCESS] Build web Vite berhasil selesai (folder dist tersedia)."
          else
            echo "[ERROR] Folder dist tidak ditemukan setelah build!"
            exit 1
          fi

      # Tahap 4: Setup Platform Android Capacitor (Sinkronisasi Web ke Android)
      - name: 4. Setup Platform Android Capacitor
        run: |
          echo "[INFO] Menyiapkan paket Capacitor..."
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          # Inisialisasi folder android jika belum ada
          if [ ! -d "android" ]; then
            echo "[INFO] Folder android belum ada. Menginisialisasi proyek Android native..."
            npx cap add android
          fi
          
          # Sinkronisasikan hasil build dist/ ke platform Android
          echo "[INFO] Menjalankan npx cap sync android..."
          npx cap sync android
          echo "[SUCCESS] Sinkronisasi web assets ke Android selesai."

      # Tahap 5: Setup Java 17 (actions/setup-java@v4 dengan distribusi temurin)
      - name: 5. Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verifikasi Versi Java
        run: |
          java -version

      # Tahap 6: Setup Android SDK & Lisensi
      - name: 6. Setup Android SDK & Lisensi
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Menerima lisensi Android SDK bawaan GitHub Runner
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi
          echo "[SUCCESS] Android SDK & lisensi siap digunakan."

      # Tahap 7: Build APK Debug dengan Gradle (assembleDebug)
      - name: 7. Build APK Debug dengan Gradle
        run: |
          # Otomatisasi pembuatan debug keystore jika belum ada
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "[INFO] debug.keystore belum ada. Membuat keystore baru..."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "[SUCCESS] debug.keystore berhasil dibuat."
          fi

          if [ -d "android/app" ]; then
            cp ~/.android/debug.keystore android/app/debug.keystore || true
          fi

          cd android

          # Otomatisasi pembuatan file local.properties jika belum ada
          if [ ! -f local.properties ]; then
            echo "[INFO] Membuat local.properties dengan sdk.dir=$ANDROID_HOME..."
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

          # Memastikan hak akses executable untuk gradlew
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "[SUCCESS] Izin chmod +x diberikan ke gradlew."
          fi

          # Menjalankan kompilasi APK Debug
          echo "[INFO] Menjalankan ./gradlew assembleDebug..."
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

          # Organisasi file output APK
          mkdir -p build-artifacts
          FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            echo "[INFO] Menemukan file APK di: $FOUND_APK"
            cp "$FOUND_APK" build-artifacts/BengkelQu-1.60-debug.apk
            echo "[SUCCESS] File APK disalin ke: build-artifacts/BengkelQu-1.60-debug.apk"
          else
            echo "[ERROR] File APK tidak ditemukan di direktori output Gradle!"
            find android -name "*.apk" || true
            exit 1
          fi

      # Tahap 8: Upload Artifact APK (actions/upload-artifact@v4)
      - name: 8. Upload Artifact APK (actions/upload-artifact@v4)
        uses: actions/upload-artifact@v4
        with:
          name: BengkelQu-1.60-Android-APK-Debug
          path: |
            build-artifacts/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
