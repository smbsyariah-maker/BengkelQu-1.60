name: Build Android APK (Debug)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Debug) dengan Gradle & Java 17
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'

    steps:
      # 1. Checkout kode repositori
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # 2. Pengecekan file .env (menyalin dari .env.example jika belum tersedia)
      - name: 2. Pengecekan File .env (Copy dari .env.example jika belum tersedia)
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              echo "[INFO] File .env tidak ditemukan. Menyalin dari .env.example..."
              cp .env.example .env
              echo "[SUCCESS] File .env berhasil dibuat dari .env.example."
            else
              echo "[WARN] File .env.example tidak ditemukan. Membuat file .env kosong..."
              touch .env
            fi
          else
            echo "[INFO] File .env sudah ada."
          fi

      # 3. Setup Node.js 22 (Capacitor CLI v7+ memerlukan Node.js minimal v22.0.0)
      - name: 3. Set Up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Verifikasi Versi Node.js & npm
        run: |
          echo "[INFO] Versi Node.js: $(node -v)"
          echo "[INFO] Versi npm: $(npm -v)"

      # 4. Setup Java JDK 17 (Temurin)
      - name: 4. Set Up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verifikasi Versi Java
        run: |
          java -version

      # 5. Otomatis membuat atau mendeteksi file debug.keystore
      - name: 5. Otomatis Deteksi atau Buat debug.keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "[INFO] debug.keystore belum ada. Membuat debug.keystore baru..."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "[SUCCESS] debug.keystore berhasil dibuat di ~/.android/debug.keystore"
          else
            echo "[INFO] debug.keystore sudah ditemukan di ~/.android/debug.keystore"
          fi

      # 6. Konfigurasi Android SDK bawaan GitHub Runner & Terima Lisensi
      - name: 6. Konfigurasi Android SDK bawaan Runner & Lisensi
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Menerima lisensi Android SDK bawaan GitHub Runner
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
          fi
          echo "[SUCCESS] Android SDK siap digunakan."

      # 7. Install dependencies web dengan legacy-peer-deps dan build Vite
      - name: 7. Install Dependencies dan Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      # 8. Setup platform native Android via Capacitor
      - name: 8. Setup Platform Android via Capacitor
        run: |
          # Install dependencies Capacitor dengan kompatibilitas Node 22
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          # Inisialisasi folder android jika belum ada
          if [ ! -d "android" ]; then
            echo "[INFO] Menginisialisasi proyek Android native dengan Capacitor..."
            npx cap add android
          fi
          
          # Sinkronisasikan hasil build dist/ ke platform Android
          echo "[INFO] Sinkronisasi web assets ke Android..."
          npx cap sync android
          
          # Salin debug.keystore ke folder android/app
          if [ -d "android/app" ]; then
            cp ~/.android/debug.keystore android/app/debug.keystore || true
            echo "[SUCCESS] debug.keystore disalin ke android/app/debug.keystore"
          fi

      # 9. Menyiapkan hak akses chmod +x untuk gradlew
      - name: 9. Menyiapkan Hak Akses chmod +x untuk gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            echo "[SUCCESS] Hak akses chmod +x berhasil diberikan ke android/gradlew"
          elif [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "[SUCCESS] Hak akses chmod +x berhasil diberikan ke ./gradlew"
          else
            echo "[WARN] File gradlew tidak ditemukan."
          fi

      # 10. Build Android APK Debug menggunakan Gradle
      - name: 10. Build Android APK Debug dengan Gradle
        run: |
          cd android
          # Pastikan local.properties mengenali android home jika belum ada
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      # 11. Organisasi file output APK
      - name: 11. Siapkan Berkas APK Output
        run: |
          mkdir -p build-artifacts
          FOUND_APK=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            echo "[INFO] Menemukan file APK di: $FOUND_APK"
            cp "$FOUND_APK" build-artifacts/BengkelQu-1.60-debug.apk
            echo "[SUCCESS] File APK berhasil disiapkan di build-artifacts/BengkelQu-1.60-debug.apk"
          elif [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/BengkelQu-1.60-debug.apk
            echo "[SUCCESS] File APK siap: build-artifacts/BengkelQu-1.60-debug.apk"
          else
            echo "[ERROR] File APK tidak ditemukan di direktori output Gradle!"
            find android -name "*.apk" || true
            exit 1
          fi

      # 12. Upload hasil file APK menggunakan actions/upload-artifact@v4
      - name: 12. Upload Hasil File APK (actions/upload-artifact@v4)
        uses: actions/upload-artifact@v4
        with:
          name: BengkelQu-1.60-Android-APK-Debug
          path: |
            build-artifacts/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error
