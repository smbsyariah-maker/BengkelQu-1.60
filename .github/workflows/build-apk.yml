name: Build Android APK (Bengkel Qu 1.60)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_VERSION: '22'
      CI: 'true'
      CAPACITOR_TELEMETRY: 'false'

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: 3. Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. Setup Android SDK Tools & Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 5. Prepare environment and debug keystore
        run: |
          # Siapkan .env
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

          # Buat debug keystore jika belum ada
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          elif [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 6. Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: 7. Inisialisasi & Sinkronisasi Platform Android
        run: |
          # Pastikan paket Capacitor terpasang
          npm install --legacy-peer-deps @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          # Inisialisasi platform android jika gradlew belum ada
          if [ ! -f "android/gradlew" ]; then
            echo "[INFO] Membuat platform android native via Capacitor..."
            rm -rf android
            npx cap add android
          fi

          echo "[INFO] Menyinkronkan aset web ke Android..."
          npx cap sync android

          # Salin debug keystore ke folder android/app jika ada
          if [ -d "android/app" ]; then
            cp ~/.android/debug.keystore android/app/debug.keystore 2>/dev/null || true
          fi

          # Konfigurasi variables.gradle ke SDK 35 yang kompatibel
          {
            echo "ext {"
            echo "    minSdkVersion = 24"
            echo "    compileSdkVersion = 35"
            echo "    targetSdkVersion = 35"
            echo "    androidxActivityVersion = '1.9.3'"
            echo "    androidxAppCompatVersion = '1.7.0'"
            echo "    androidxCoordinatorLayoutVersion = '1.2.0'"
            echo "    androidxCoreVersion = '1.15.0'"
            echo "    androidxFragmentVersion = '1.8.5'"
            echo "    coreSplashScreenVersion = '1.0.1'"
            echo "    androidxWebkitVersion = '1.12.1'"
            echo "    junitVersion = '4.13.2'"
            echo "    androidxJunitVersion = '1.2.1'"
            echo "    androidxEspressoCoreVersion = '3.6.1'"
            echo "    cordovaAndroidVersion = '14.0.1'"
            echo "}"
          } > android/variables.gradle

          # Konfigurasi gradle.properties optimal untuk CI
          {
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=false"
            echo "org.gradle.parallel=false"
            echo "android.useAndroidX=true"
            echo "android.enableJetifier=true"
            echo "android.builder.sdkDownload=true"
          } > android/gradle.properties

          # Pastikan local.properties mengenali ANDROID_HOME
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          fi

          # Beri izin eksekusi gradlew di root dan di folder android
          chmod +x android/gradlew 2>/dev/null || true
          chmod +x gradlew 2>/dev/null || true

      - name: 8. Build APK with Gradle
        timeout-minutes: 15
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
          else
            cd android
            ./gradlew assembleDebug --no-daemon --stacktrace -x test -x lint
            cd ..
          fi

      - name: 9. Siapkan File APK
        run: |
          mkdir -p output-apk
          APK_FILE=$(find . -type f \( -name "*debug.apk" -o -name "*.apk" \) | grep -v "node_modules" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output-apk/BengkelQu-1.60.apk
            echo "[SUCCESS] APK Berhasil dibuat di output-apk/BengkelQu-1.60.apk (Sumber: $APK_FILE)"
            ls -lh output-apk/
          else
            echo "[ERROR] File APK tidak ditemukan di build outputs!"
            find . -name "*.apk" || true
            exit 1
          fi

      - name: 10. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BengkelQu-1.60-APK
          path: output-apk/BengkelQu-1.60.apk
          retention-days: 30
          if-no-files-found: error
